name: Claude Code Review

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    if: github.event.pull_request.author_association == 'OWNER' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture bun path and debug info
        id: bun-info
        run: |
          BUN_PATH=$(which bun)
          echo "path=$BUN_PATH" >> $GITHUB_OUTPUT
          echo "=== Bun Debug Info ==="
          echo "Which bun: $BUN_PATH"
          echo "Bun version: $(bun --version)"
          echo "PATH: $PATH"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: ${{ steps.bun-info.outputs.path }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment'
          show_full_output: false
          claude_args: '--allowedTools "Agent,Read,Write,Edit,Bash(git:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checkout:*),Bash(git log:*),Bash(bun run test:*),Bash(bun run lint:*),Bash(bun run build:*),Bash(bun test:*),Bash(npx tsc:*),Bash(bun run tsc:*),Bash(bun run typecheck*),Bash(gh pr checks:*),Bash(npx biome check:*),Bash(git fetch:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh api:*),Bash(mkdir:*),Bash(node:*),Bash(grep:*),Bash(awk:*),Bash(find:*),Bash(sed:*),Bash(cut:*),Bash(wc:*),Bash(ls:*),Bash(pwd:*),Bash(echo:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report tool permission denials
        if: always() && steps.claude-review.outcome != 'skipped'
        run: |
          LOG_FILE="/home/runner/work/_temp/claude-execution-output.json"
          if [ ! -f "$LOG_FILE" ]; then
            echo "Execution log not found at $LOG_FILE"
            exit 0
          fi
          DENIALS=$(jq -s -r '
            [.[]? | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | {id, name, input}] as $uses
            | [.[]? | select(.type == "system" and .subtype == "permission_denied")][]?
            | . as $d
            | ($uses[]? | select(.id == $d.tool_use_id)) as $u
            | "- **\($u.name // "unknown")**: `\($u.input.command // $u.input.description // ($u.input | tostring))`"
          ' "$LOG_FILE" 2>/dev/null) || true
          if [ -n "$DENIALS" ]; then
            {
              echo "## ⚠️ Tool permission denials"
              echo "$DENIALS"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No tool permission denials found."
          fi

